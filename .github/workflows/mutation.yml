name: mutation-nightly

# Phase 4b nightly mutation-testing run. Policy: docs/decisions/0002-mutation-testing.md
# Never merge-blocking; the score is a quality signal, not a gate.
# Audit-on-success: docs/audits/current-mutation.md is rotated and rewritten on
# every successful run, regardless of regression status, so the absence of an
# audit means the cron broke (not that everything is fine).

on:
  schedule:
    # 03:00 UTC daily — quiet window for most contributor timezones
    - cron: "0 3 * * *"
  workflow_dispatch: {}  # manual trigger from the Actions tab

permissions:
  contents: write   # commit the rotated audit file
  issues:  write    # open / comment on a regression-tracking issue

concurrency:
  group: mutation-nightly
  cancel-in-progress: false

jobs:
  mutation:
    name: mutation testing (nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 60   # Phase 4b stop-rule: full scope under 45 min;
                          # 60 min ceiling allows for CI-runner variance.

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # full history so the audit commit is not orphaned

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Poetry installation
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install Poetry
        run: |
          pipx install poetry || python -m pip install --user poetry

      - name: Install dependencies (with mutation group)
        run: |
          poetry install --with test --with mutation --no-interaction

      - name: Install Pandoc
        # Pandoc is needed to satisfy module-import side effects in the unit
        # suite even though mutation-scope modules are pure-logic.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pandoc

      - name: Run mutation tests (full scope)
        id: mutation
        run: |
          set +e
          poetry run mutmut run
          mutmut_rc=$?
          set -e
          # mutmut returns non-zero when there are surviving mutants. We
          # don't fail the workflow on that — survivors are the input to
          # the response protocol, not a build error.
          echo "mutmut_rc=$mutmut_rc" >> "$GITHUB_OUTPUT"

      - name: Enforce per-module thresholds
        id: thresholds
        run: |
          set +e
          poetry run python scripts/check_mutation_thresholds.py | tee threshold-report.txt
          thr_rc=${PIPESTATUS[0]}
          set -e
          echo "thr_rc=$thr_rc" >> "$GITHUB_OUTPUT"
          # Save threshold output for the audit file step.
          mv threshold-report.txt /tmp/mutation-threshold-report.txt

      - name: Write the mutation context (awesome-well-tested docs/mutation-context.md)
        # The context that makes the score comparable: tool and version, scope, the
        # full result breakdown, the equivalent count, mutmut's own score and the
        # strict one of TESTING.md §14.4. The converter is pinned to a commit of the
        # list that defines the schema.
        run: |
          poetry run mutmut export-cicd-stats
          curl -fsSL -o /tmp/mutation_context.py \
            https://raw.githubusercontent.com/awesome-references/awesome-well-tested/3d1258db8b54a1ad239229869eec9d57c527991c/scripts/mutation_context.py
          targets=()
          while IFS= read -r path; do targets+=(--target "$path"); done < <(
            poetry run python -c 'import tomllib; print("\n".join(tomllib.load(open("pyproject.toml", "rb"))["tool"]["mutmut"]["paths_to_mutate"]))'
          )
          poetry run python /tmp/mutation_context.py --mutmut mutants/mutmut-cicd-stats.json \
            --tool-version "$(poetry run python -c 'import importlib.metadata as m; print(m.version("mutmut"))')" \
            --equivalent "$(poetry run python scripts/check_mutation_thresholds.py --equivalent-count)" \
            "${targets[@]}" --out mutants/mutation-context.json
          cat mutants/mutation-context.json

      - name: Keep the mutation context
        uses: actions/upload-artifact@v7
        with:
          name: mutation-context
          path: mutants/mutation-context.json

      - name: Render mutation audit
        # Run unconditionally so the audit reflects the run even on threshold
        # regression. This is the audit-on-success rule from ADR-0002.
        if: always()
        run: |
          poetry run mutmut export-cicd-stats
          # mutmut writes its global stats to mutants/mutmut-cicd-stats.json
          today="$(date -u +%Y-%m-%d)"
          audit_dir="docs/audits"
          history_dir="$audit_dir/history"
          mkdir -p "$history_dir"

          # Rotate previous current-mutation.md into history/ if its
          # `Audit date:` header survives. (Same rotation contract as
          # docs/audits/current-coverage.md per TESTING.md §3.)
          if [ -f "$audit_dir/current-mutation.md" ]; then
            prev_date="$(grep -m1 '^Audit date:' "$audit_dir/current-mutation.md" \
                          | sed 's/^Audit date:[[:space:]]*//')"
            if [ -n "$prev_date" ]; then
              mv "$audit_dir/current-mutation.md" \
                 "$history_dir/${prev_date}-mutation.md"
            fi
          fi

          # Write fresh audit.
          {
            echo "# Mutation testing audit"
            echo
            echo "Audit date: $today"
            echo "Generated by: .github/workflows/mutation.yml @ $(git rev-parse --short HEAD)"
            echo "Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "## Per-module thresholds"
            echo
            echo '```'
            cat /tmp/mutation-threshold-report.txt
            echo '```'
            echo
            echo "## Global statistics (from mutmut export-cicd-stats)"
            echo
            echo '```json'
            cat mutants/mutmut-cicd-stats.json 2>/dev/null || echo '{}'
            echo '```'
            echo
            echo "## Surviving mutants"
            echo
            echo '```'
            poetry run mutmut results 2>/dev/null | grep -vE ': not checked$' || echo "(none)"
            echo '```'
            echo
            echo "## Outcome"
            echo
            if [ "${{ steps.thresholds.outputs.thr_rc }}" = "0" ]; then
              echo "All in-scope modules met their mutation thresholds."
            else
              echo "Threshold regression — see above. Triage per docs/TESTING.md §14.5 (A/B/C/D)."
            fi
          } > "$audit_dir/current-mutation.md"

      - name: Refresh the mutation badge in the README
        # The global score uses the per-module formula of
        # scripts/check_mutation_thresholds.py over every in-scope module:
        # killed / (total - equivalent). Shields.io renders the static badge
        # and awesome-well-tested reads the figure off it.
        if: always()
        run: |
          score="$(python3 - <<'PY'
          import re
          # A module row: path, the integer columns (killed first, equivalent
          # and total last; the number of columns in between has changed
          # before), the score with a % sign, the threshold, the verdict.
          killed = denom = 0
          for line in open("/tmp/mutation-threshold-report.txt", encoding="utf-8"):
              m = re.match(r"src/\S+((?:\s+\d+)+)\s+[\d.]+%", line)
              if m:
                  nums = [int(n) for n in m.group(1).split()]
                  killed += nums[0]
                  denom += nums[-1] - nums[-2]
          print(f"{100.0 * killed / denom:.1f}" if denom else "")
          PY
          )"
          if [ -z "$score" ]; then
            echo "No threshold table; badge left as it is."
            exit 0
          fi
          color=red
          awk "BEGIN {exit !($score >= 70)}" && color=yellow
          awk "BEGIN {exit !($score >= 90)}" && color=brightgreen
          echo "mutation score: $score % ($color)"
          sed -i -E "s#img\.shields\.io/badge/mutation%20score-[0-9.]+%25-[a-z]+#img.shields.io/badge/mutation%20score-${score}%25-${color}#" README.md

      - name: Commit rotated audit
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "manuscripta-mutation-bot"
          git config user.email "actions-bot@users.noreply.github.com"
          git add docs/audits/current-mutation.md docs/audits/history/ README.md || true
          if git diff --staged --quiet; then
            echo "Audit unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "$(printf 'docs(audit): nightly mutation audit %s\n\nAuto-generated by .github/workflows/mutation.yml.\nThreshold gate exit code: %s\n' \
                         "$(date -u +%Y-%m-%d)" \
                         "${{ steps.thresholds.outputs.thr_rc }}")"
          # main moves while the run takes its ten minutes (a merge landed during the
          # dispatched run of 2026-10-17 and the push was rejected with "fetch first"),
          # so rebase the audit commit onto the branch as it is now, up to three times.
          for attempt in 1 2 3; do
            git pull --rebase --quiet origin "${{ github.ref_name }}" || exit 1
            if git push origin HEAD:${{ github.ref_name }}; then
              exit 0
            fi
            echo "push rejected (attempt $attempt): ${{ github.ref_name }} moved during the run, rebasing again"
            sleep 15
          done
          echo "::error::could not push the audit after three attempts"
          exit 1

      - name: Open issue on threshold regression
        if: always() && steps.thresholds.outputs.thr_rc != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Dedup: one standing issue tracks the regression until it is
          # closed. Without this guard the schedule opens a new issue
          # every night for the same unresolved threshold gap.
          existing="$(gh issue list --state open --label mutation \
                        --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "Open mutation issue #$existing already tracks this; skipping."
            exit 0
          fi
          today="$(date -u +%Y-%m-%d)"
          gh issue create \
            --title "mutation: per-module threshold regression $today" \
            --label "mutation,quality,nightly" \
            --body "$(printf 'The nightly mutation run on %s found one or more modules below their configured threshold.\n\nAudit: docs/audits/current-mutation.md (commit %s)\n\nWorkflow run: %s/%s/actions/runs/%s\n\nTriage per docs/TESTING.md §14.5 (A/B/C/D categories). Do not silently lower thresholds; do not pin mutation-targeting literals.\n' \
                         "$today" \
                         "$(git rev-parse --short HEAD)" \
                         "${{ github.server_url }}" \
                         "${{ github.repository }}" \
                         "${{ github.run_id }}")"

      # Final exit: red when a module sits below its threshold (ADR-0002
      # amendment of 2026-10-16) and when the infrastructure broke. The audit
      # and the issue are already written by then, every step above runs
      # with if: always(). Pull requests never run this workflow, so a red
      # nightly gates nothing; it is the floor somebody else's machine
      # verified: a green run means every module scored at least the
      # `default` of [tool.manuscripta.mutation_thresholds] in pyproject.toml.
      - name: Workflow exit
        if: always()
        run: |
          echo "mutmut_rc=${{ steps.mutation.outputs.mutmut_rc }}"
          echo "threshold_rc=${{ steps.thresholds.outputs.thr_rc }}"
          # Non-numeric or truly-broken mutmut → fail. Surviving-mutant exit
          # codes (1/non-zero with audit produced) are judged by the threshold
          # step, not here.
          if [ -z "${{ steps.mutation.outputs.mutmut_rc }}" ]; then
            echo "mutmut step did not produce an exit code — workflow infrastructure broken"
            exit 1
          fi
          if [ "${{ steps.thresholds.outputs.thr_rc }}" != "0" ]; then
            echo "threshold regression — see docs/audits/current-mutation.md and the mutation issue"
            exit 1
          fi
          exit 0
