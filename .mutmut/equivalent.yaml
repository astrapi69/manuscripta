# --- Ad-hoc — dead belt-and-braces inside _repl_h1 ---
# Reasoning (shared for mutants 23, 30, 31, 32, 34): `rest` is group 3 of
# the H1 pattern, `(:.*?)` — lazy, followed by the optional anchor group
# `(\s*\{#-chapter-\d+\}\s*)?`, then `\s*(?:\n|$)`. The lazy group stops at
# the first position from which the remainder matches, which is right
