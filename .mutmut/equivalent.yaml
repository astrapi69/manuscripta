# --- Ad-hoc cluster: POSIX coincidence — is_absolute() ⟺ startswith("/") ---
# Reasoning (shared for mutants 1, 3, 4): on POSIX, PurePosixPath.
# is_absolute() is definitionally "the path starts with '/'", so the two
# operands of `Path(p).is_absolute() or p.startswith("/")` coincide on
# every input the test platform can produce; the startswith clause is
# defensive redundancy for Windows-style inputs on Windows hosts, which
# this project's CI (ubuntu-only, per .github/workflows/) never runs.
#   mutant 1 (`or` -> `and`): differs only when exactly one operand is
#     true — impossible on POSIX.
#   mutant 3 (`startswith(None)` -> TypeError): reached only when
#     is_absolute() is False; the TypeError is swallowed by the
#     function's `except Exception: return False`, which equals the
#     original's False (startswith("/") is False whenever is_absolute()
#     is False on POSIX).
#   mutant 4 (`startswith("XX/XX")`, never true): same reachability
#     argument as mutant 3.
# If the project ever gains Windows CI, all three re-triage to A.
src/manuscripta/paths/to_relative.py:manuscripta.paths.to_relative.x__is_absolute_path__mutmut_1
